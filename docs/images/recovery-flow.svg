<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#008979"/></marker></defs><rect width="1600" height="1080" fill="#F4F7FB"/><path d="M0 0 H1600 V165 H0 Z" fill="#172B43"/><g font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif"><text x="64" y="82" font-size="44" fill="#FFFFFF" font-weight="700">VeriReturn</text><text x="310" y="82" font-size="34" fill="#FFFFFF" font-weight="500">可验证的售后恢复</text><text x="64" y="137" font-size="24" fill="#D7E4F2" font-weight="400">模型选择下一步 · 领域规则控制执行 · 最终业务事实证明完成</text><text x="64" y="206" font-size="19" fill="#586D83" font-weight="400">React / 会话与任务记忆</text><text x="450" y="206" font-size="19" fill="#586D83" font-weight="400">LangGraph / DeepSeek</text><text x="834" y="206" font-size="19" fill="#586D83" font-weight="400">FastAPI / PostgreSQL</text><text x="1210" y="206" font-size="19" fill="#586D83" font-weight="400">Outbox / Inbox / Worker</text><rect x="64" y="236" width="340" height="230" rx="18" fill="white" stroke="#DFE6EF"/><rect x="88" y="266" width="5" height="28" rx="2" fill="#008979"/><text x="106" y="290" font-size="25" fill="#172B43" font-weight="700">01  客户目标与授权</text><text x="88" y="337" font-size="20" fill="#586D83" font-weight="400">商品、数量与期望方案</text><text x="88" y="373" font-size="20" fill="#586D83" font-weight="400">多任务记忆与当前焦点</text><text x="88" y="409" font-size="20" fill="#586D83" font-weight="400">新方案必须重新确认</text><rect x="440" y="236" width="340" height="230" rx="18" fill="white" stroke="#DFE6EF"/><rect x="464" y="266" width="5" height="28" rx="2" fill="#008979"/><text x="482" y="290" font-size="25" fill="#172B43" font-weight="700">02  模型恢复规划</text><text x="464" y="337" font-size="20" fill="#586D83" font-weight="400">理解工具观察与执行证据</text><text x="464" y="373" font-size="20" fill="#586D83" font-weight="400">选择核验、重试或改方案</text><text x="464" y="409" font-size="20" fill="#586D83" font-weight="400">预算内继续，必要时转人工</text><rect x="816" y="236" width="340" height="230" rx="18" fill="white" stroke="#DFE6EF"/><rect x="840" y="266" width="5" height="28" rx="2" fill="#008979"/><text x="858" y="290" font-size="25" fill="#172B43" font-weight="700">03  领域服务执行</text><text x="840" y="337" font-size="20" fill="#586D83" font-weight="400">权限、金额与数量校验</text><text x="840" y="373" font-size="20" fill="#586D83" font-weight="400">事务、行锁、幂等与版本</text><text x="840" y="409" font-size="20" fill="#586D83" font-weight="400">库存预占与退款命令</text><rect x="1192" y="236" width="340" height="230" rx="18" fill="white" stroke="#DFE6EF"/><rect x="1216" y="266" width="5" height="28" rx="2" fill="#008979"/><text x="1234" y="290" font-size="25" fill="#172B43" font-weight="700">04  渠道与履约事实</text><text x="1216" y="337" font-size="20" fill="#586D83" font-weight="400">退款提交与验签回调</text><text x="1216" y="373" font-size="20" fill="#586D83" font-weight="400">换货出库与签收回写</text><text x="1216" y="409" font-size="20" fill="#586D83" font-weight="400">独立判定最终业务状态</text><path d="M 408 350 H 432" stroke="#008979" stroke-width="3" marker-end="url(#arrow)"/><path d="M 784 350 H 808" stroke="#008979" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1160 350 H 1184" stroke="#008979" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1362 466 V 519 H 610 V 474" stroke="#008979" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="780" y="494" width="452" height="47" rx="12" fill="#F4F7FB"/><text x="798" y="524" font-size="23" fill="#008979" font-weight="600">工具反馈 → 状态核验 → 再规划</text><rect x="64" y="579" width="1468" height="151" rx="18" fill="white" stroke="#DFE6EF"/><rect x="88" y="609" width="5" height="28" rx="2" fill="#5475D1"/><text x="106" y="633" font-size="25" fill="#172B43" font-weight="700">持久化恢复与执行证据</text><text x="88" y="680" font-size="20" fill="#586D83" font-weight="400">任务 / Checkpoint / 未决命令 / 方案确认 / 观察与动作 / 调用成本 / 审计记录</text><text x="88" y="716" font-size="20" fill="#586D83" font-weight="400">Worker 租约与所有权校验 · 预算原子预留 · 崩溃后按领域事实继续，避免重复执行</text><rect x="64" y="787" width="464" height="157" rx="18" fill="white" stroke="#DFE6EF"/><rect x="88" y="817" width="5" height="28" rx="2" fill="#008979"/><text x="106" y="841" font-size="25" fill="#172B43" font-weight="700">完整完成</text><text x="88" y="888" font-size="20" fill="#586D83" font-weight="400">退款：渠道成功 + 账本 + 数量同步</text><text x="88" y="924" font-size="20" fill="#586D83" font-weight="400">换货：履约签收事实回写</text><rect x="566" y="787" width="464" height="157" rx="18" fill="white" stroke="#DFE6EF"/><rect x="590" y="817" width="5" height="28" rx="2" fill="#5475D1"/><text x="608" y="841" font-size="25" fill="#172B43" font-weight="700">等待客户 / 等待补货</text><text x="590" y="888" font-size="20" fill="#586D83" font-weight="400">方案版本、业务状态与确认有效期</text><text x="590" y="924" font-size="20" fill="#586D83" font-weight="400">刷新或重启后恢复开放任务</text><rect x="1068" y="787" width="464" height="157" rx="18" fill="white" stroke="#DFE6EF"/><rect x="1092" y="817" width="5" height="28" rx="2" fill="#B77B2B"/><text x="1110" y="841" font-size="25" fill="#172B43" font-weight="700">人工处理 / 停止</text><text x="1092" y="888" font-size="20" fill="#586D83" font-weight="400">真实工单与可追溯原因</text><text x="1092" y="924" font-size="20" fill="#586D83" font-weight="400">不把转人工算成自主完成</text><text x="64" y="1007" font-size="20" fill="#586D83" font-weight="400">每轮默认上限：8 次工具调用 / 4 次模型规划 / 120 秒；读取最多重试两次。</text><text x="64" y="1046" font-size="19" fill="#586D83" font-weight="400">展示环境使用模拟支付与履约；故障注入仅限隔离演示数据，生产环境禁用。</text></g></svg>